# DO NOT commit your real secrets.toml to GitHub.
# Locally: save this as .streamlit/secrets.toml (gitignored) and fill in real values.
# On Streamlit Community Cloud: paste the filled-in version into
#   App settings -> Secrets (in the Streamlit Cloud dashboard), NOT into the repo.

[snowflake]
user = "YOUR_SNOWFLAKE_USERNAME"
password = "YOUR_SNOWFLAKE_PASSWORD"
account = "YOUR_ACCOUNT_IDENTIFIER"   # e.g. abcd-xy12345 (find it in Snowsight -> bottom left -> Account)
warehouse = "COMPUTE_WH"              # your default trial warehouse name
database = "CAPSTONE30"
schema = "PIPELINE_DQ"
